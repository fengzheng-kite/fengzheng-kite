    <ellipse cx="137" cy="143" rx="43" ry="17" fill="#E7F5FB"/>
    <ellipse cx="137" cy="137" rx="34" ry="13" fill="#FFFFFF"/>
    <circle cx="137" cy="137" r="15" fill="#9DCEF1"/>

