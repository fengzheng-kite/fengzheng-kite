  <path d="M68 105Q190 111 326 104" stroke="#FFE06B" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="66" y="90" fill="#262D3D" font-size="46" font-weight="750">Hi, I'm Shenrui! 👋</text>
    <text x="68" y="137" fill="#526071" font-size="21">Embodied AI · Robot Learning · Multimodal Intelligence</text>
    <text x="68" y="181" fill="#788596" font-size="16">I build robots that can move, feel, and learn.</text>
    <g font-size="14" font-weight="600">
      <rect x="68" y="213" width="137" height="34" rx="17" fill="#FFE7F2"/><text x="136" y="235" text-anchor="middle" fill="#B84679">World Model</text>
      <rect x="216" y="213" width="123" height="34" rx="17" fill="#E2F5FF"/><text x="277" y="235" text-anchor="middle" fill="#287DA5">VLA Model</text>
      <rect x="350" y="213" width="122" height="34" rx="17" fill="#E7F8EA"/><text x="411" y="235" text-anchor="middle" fill="#38815A">Sim-to-Real</text>
    </g>
    <text x="69" y="283" fill="#A0A9B5" font-size="12" letter-spacing="2">CUHK-SHENZHEN</text>
  </g>
  <g transform="translate(810 25)" fill="none" stroke="#344155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="142" cy="247" rx="106" ry="14" fill="#DCECF4" stroke="none" opacity=".62"/>

    <!-- Friendly wheeled base -->
    <path d="M56 177Q62 147 95 139H183Q216 147 224 177L231 214Q230 235 205 239H76Q49 235 49 214Z" fill="#FFFFFF"/>
    <path d="M190 144Q215 152 222 179L225 196H190Q181 175 190 144Z" fill="#BFEFD9" stroke="none"/>
    <path d="M68 180Q72 157 99 154H172Q194 157 201 180V207H68Z" fill="#F8FCFE" stroke="none"/>
    <rect x="78" y="169" width="111" height="51" rx="25" fill="#344B61" stroke="#344155" stroke-width="3"/>
    <path d="M102 192q7-12 14 0M151 192q7-12 14 0" stroke="#71E1F2" stroke-width="5"/>
    <path d="M126 205q9 7 18 0" stroke="#FF9DC3" stroke-width="3.5"/>
    <circle cx="82" cy="225" r="5" fill="#FFD95E" stroke="none"/>
    <circle cx="197" cy="225" r="5" fill="#75D9F3" stroke="none"/>

    <!-- Wheels -->
    <circle cx="78" cy="235" r="18" fill="#3F566D"/>
    <circle cx="78" cy="235" r="9" fill="#CDEBFA"/>
    <circle cx="201" cy="235" r="18" fill="#3F566D"/>
    <circle cx="201" cy="235" r="9" fill="#CDEBFA"/>

