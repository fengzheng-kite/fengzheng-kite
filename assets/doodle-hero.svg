    <path d="M127 133L101 86Q96 76 104 68L116 58Q126 52 134 62L158 111Q163 122 154 130L143 138Q133 143 127 133Z" fill="#FFFFFF"/>
    <path d="M110 91L128 78L148 117L132 130Z" fill="#A9D5F5" stroke="none"/>
    <circle cx="112" cy="72" r="17" fill="#FFFFFF"/>
    <circle cx="112" cy="72" r="9" fill="#9DCEF1"/>
    <path d="M102 65L69 47Q59 41 61 30L64 17Q67 7 78 10L124 44Q134 51 126 61L120 68Q113 75 102 65Z" fill="#FFFFFF"/>
    <path d="M69 47L78 28L117 54L107 67Z" fill="#A9D5F5" stroke="none"/>

